# Checks run on every pull request and every push to main; the site is published from main once they pass.
# Rebuilding the data from its sources stays local (scripts/check.sh, the pipeline's build).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync
        working-directory: pipeline
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: pipeline
      - run: uv run pytest -q
        working-directory: pipeline

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npx vitest run --exclude test/model/timing.test.ts
        working-directory: app
      - name: Speed budgets (informational on shared runners)
        run: npx vitest run test/model/timing.test.ts
        working-directory: app
        continue-on-error: true

  # In Playwright's image, which has Chromium and its system libraries: no install step. The tests
  # run on the built and pre-rendered site, which is what main publishes; desktop and phone run
  # side by side, each building the site.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    container: &playwright mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Image matches the locked Playwright
        run: test "v$(node -p "require('@playwright/test/package.json').version")-noble" = "${IMAGE##*:}"
        working-directory: app
        env:
          IMAGE: *playwright
      - run: npx playwright test --project=${{ matrix.project }}
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: app/playwright-report
      - if: matrix.project == 'desktop' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pipeline, app, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
