[project]
name = "planetshift-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pandas>=2.2",
  "requests>=2.32",
  "openpyxl>=3.1",
  "fair>=2.2",
  "numpy>=1.26",
  "h5py>=3.16.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C901", "PLR0911"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-returns = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs downloaded sources (skipped unless the cache is filled)",
  "rebuild: rebuilds every section from the cache (run with PLANETSHIFT_REBUILD=1)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planetshift_pipeline"]
